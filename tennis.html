<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live tennis scores, schedules, and match updates from around the world">
    <meta name="theme-color" content="#9333ea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tennis Live Scores & Schedules | Sports Live Hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎾</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .header { background: linear-gradient(135deg, #9333ea 0%, #7e22ce 100%); }
        .nav-btn.active { background: #9333ea; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon-wrapper">
                    <span class="logo-icon">🎾</span>
                </div>
                <div class="logo-text">
                    <h1>Tennis Live</h1>
                    <span class="logo-subtitle">Real-time Scores & Schedules</span>
                </div>
            </div>
            <div class="header-right">
                <div class="live-badge">
                    <span class="live-dot"></span>
                    <span>LIVE</span>
                </div>
                <span class="last-updated" id="last-updated"></span>
            </div>
        </div>
    </header>

    <nav class="nav">
        <div class="nav-content">
            <a href="cricket.html" class="nav-btn" data-sport="cricket">
                <span class="nav-icon">🏏</span>
                <span class="nav-text">Cricket</span>
            </a>
            <a href="football.html" class="nav-btn" data-sport="football">
                <span class="nav-icon">⚽</span>
                <span class="nav-text">Football</span>
            </a>
            <a href="basketball.html" class="nav-btn" data-sport="basketball">
                <span class="nav-icon">🏀</span>
                <span class="nav-text">Basketball</span>
            </a>
            <a href="tennis.html" class="nav-btn active" data-sport="tabletennis">
                <span class="nav-icon">🎾</span>
                <span class="nav-text">Tennis</span>
            </a>
        </div>
        <button class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <main class="main-container">
        <aside class="sidebar-left">
            <div class="card calendar-card">
                <div class="card-header">
                    <span class="card-icon">📅</span>
                    <h3 class="card-title">Select Date</h3>
                </div>
                <div id="calendar"></div>
            </div>
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <div class="ad-slot">
                    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                </div>
            </div>
        </aside>

        <section class="center-content">
            <div class="card schedule-card">
                <div class="card-header">
                    <span class="card-icon">🎾</span>
                    <h3 class="card-title">Tennis Schedule</h3>
                    <span class="card-date" id="selected-date">Today</span>
                </div>
                <div id="match-list" class="match-list"></div>
            </div>
        </section>

        <aside class="sidebar-right">
            <div class="card details-card">
                <div class="card-header">
                    <span class="card-icon">📋</span>
                    <h3 class="card-title">Match Details</h3>
                </div>
                <div id="match-details" class="match-details">
                    <div class="no-selection">
                        <div class="no-selection-icon">👈</div>
                        <p>Select a match to view details</p>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <span class="footer-logo">🎾</span>
                <span>Tennis Live Hub</span>
            </div>
            <div class="footer-info">
                <span>Powered by SportSRC</span>
                <span class="footer-sep">•</span>
                <span>Real-time Data</span>
            </div>
        </div>
    </footer>

    <script>window.SPORT_PAGE = 'tabletennis';</script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
