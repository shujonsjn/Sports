<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Live Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">⚽</span>
                <h1>Sports Live Hub</h1>
            </div>
            <div class="header-right">
                <span class="live-badge">● LIVE</span>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-content">
            <button class="nav-btn active" data-sport="all">All Sports</button>
            <button class="nav-btn" data-sport="cricket">🏏 Cricket</button>
            <button class="nav-btn" data-sport="football">⚽ Football</button>
            <button class="nav-btn" data-sport="basketball">🏀 Basketball</button>
        </div>
        <button class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="main-container">

        <!-- Left Sidebar - Calendar -->
        <aside class="sidebar-left">
            <div class="card">
                <h3 class="card-title">📅 Select Date</h3>
                <div id="calendar"></div>
            </div>
        </aside>

        <!-- Center - Match Schedule -->
        <section class="center-content">
            <div class="card">
                <h3 class="card-title">🏟️ Match Schedule - <span id="selected-date">Today</span></h3>
                <div id="match-list" class="match-list">
                    <!-- Matches will be loaded here -->
                </div>
            </div>
        </section>

        <!-- Right Sidebar - Match Details -->
        <aside class="sidebar-right">
            <div class="card">
                <h3 class="card-title">📋 Match Details</h3>
                <div id="match-details" class="match-details">
                    <div class="no-selection">
                        <span class="icon">👈</span>
                        <p>Select a match to view details</p>
                    </div>
                </div>
            </div>
        </aside>

    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
